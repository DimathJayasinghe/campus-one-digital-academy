services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: campusone_db
    environment:
      SA_PASSWORD: "CampusOne@2024"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ../scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "which /opt/mssql-tools18/bin/sqlcmd >/dev/null 2>&1 && /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"CampusOne@2024\" -Q \"SELECT 1\" -C -b || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"CampusOne@2024\" -Q \"SELECT 1\" -b"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sqlserver_data:
